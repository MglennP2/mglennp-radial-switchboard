<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="256" height="256" rx="128" fill="url(#bgGrad)"/>
  <circle cx="128" cy="128" r="124" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.6"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Radial Outer Pulse Rings -->
  <g opacity="0.8">
    <circle cx="128" cy="128" r="92" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="12 8"/>
    <circle cx="128" cy="128" r="76" fill="none" stroke="url(#emeraldGrad)" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Diamond Geometry Core ($MGLN Shield) -->
  <g filter="url(#glow)">
    <!-- Top Facet -->
    <polygon points="128,40 176,80 80,80" fill="url(#primaryGrad)" opacity="0.95"/>
    
    <!-- Left Facet -->
    <polygon points="80,80 128,40 48,112" fill="#1E40AF" opacity="0.85"/>
    
    <!-- Right Facet -->
    <polygon points="176,80 128,40 208,112" fill="#2563EB" opacity="0.85"/>
    
    <!-- Center Lower Gem Facet -->
    <polygon points="80,80 176,80 128,216" fill="url(#primaryGrad)"/>
    
    <!-- Bottom Left Facet -->
    <polygon points="48,112 80,80 128,216" fill="#1D4ED8" opacity="0.9"/>
    
    <!-- Bottom Right Facet -->
    <polygon points="208,112 176,80 128,216" fill="#3B82F6" opacity="0.9"/>
    
    <!-- Inner Core Emblem (Radial "M") -->
    <path d="M96 110 L112 150 L128 122 L144 150 L160 110" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Base L2 Verified Badge Accent -->
  <circle cx="188" cy="188" r="22" fill="#0052FF" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M178 188 L185 195 L198 182" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- $MGLN Micro Text Ring -->
  <text x="128" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#94A3B8" text-anchor="middle" letter-spacing="3">
    BASE L2 • MGLN
  </text>
</svg>
